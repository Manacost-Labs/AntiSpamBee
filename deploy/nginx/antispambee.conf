server {
    listen 151.80.21.140:8443 ssl;
    listen [2001:41d0:c:c8c::]:8443 ssl;
    server_name api.hs-manacost.ru;

    access_log /var/log/nginx/antispambee.access.log;
    error_log /var/log/nginx/antispambee.error.log warn;

    ssl_certificate /var/www/httpd-cert/koloda/hs-manacost.ru.crt;
    ssl_certificate_key /var/www/httpd-cert/koloda/hs-manacost.ru.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2M;

    location = /antispambee/telegram/webhook {
        proxy_pass http://127.0.0.1:18084/telegram/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    location = /antispambee/healthz {
        proxy_pass http://127.0.0.1:18084/healthz;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    location / {
        return 404;
    }
}

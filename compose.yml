services:
  nats:
    image: nats:2.14.6-alpine
    command:
      - --jetstream
      - --store_dir=/data
      - --http_port=8222
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: antispambee
      POSTGRES_USER: antispambee
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/000001-init.sh:ro

volumes:
  nats-data:
  postgres-data:
